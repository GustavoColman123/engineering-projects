name: Temporary photo repair

on:
  push:
    paths:
      - '.github/workflows/tmp-fix-photo.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exact JPEG
        run: |
          cat .tmp-photo-fix/chunk-*.txt | tr -d '\n\r' | base64 -d > 555-light-to-frequency-converter/hardware/photos/02-led-blink-state.jpg
          test "$(wc -c < 555-light-to-frequency-converter/hardware/photos/02-led-blink-state.jpg)" -eq 31641
      - name: Commit repaired image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 555-light-to-frequency-converter/hardware/photos/02-led-blink-state.jpg
          git commit -m "fix: restore clear 555 LED evidence photo"
          git push
